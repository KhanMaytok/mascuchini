<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascuchini — prototipo multijugador</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <section id="creator" class="panel creator">
      <p class="eyebrow">MASCuchini</p>
      <h1>Crea tu personaje</h1>
      <form id="character-form">
        <label>Nombre <input name="name" minlength="3" maxlength="16" required autofocus /></label>
        <label>Clase
          <select name="characterClass">
            <option>Dark Knight</option>
            <option>Dark Wizard</option>
            <option>Fairy Elf</option>
          </select>
        </label>
        <button type="submit">Entrar a Lorencia</button>
        <p id="error" role="alert"></p>
      </form>
    </section>

    <aside id="hud" class="panel hud" hidden>
      <strong>Jugadores conectados</strong>
      <ul id="players"></ul>
      <small>Haz clic sobre el mapa para desplazarte.</small>
    </aside>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
